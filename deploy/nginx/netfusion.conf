# ==============================================================================
# NetFusion Framework — Universal Production Nginx VirtualHost
# Suitable for : Ubuntu, Debian, CentOS, RHEL, AlmaLinux, Rocky Linux, Alpine
# Paths        : Ubuntu/Debian -> /etc/nginx/sites-available/netfusion.conf
#                RHEL/CentOS   -> /etc/nginx/conf.d/netfusion.conf
# Author       : Md. Atiquzzaman Ashish (DotNetBD)
# Website      : www.dotnetbd.com
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com;

    # Point directly to the framework's public folder
    root /var/www/netfusion/public;
    index index.php index.html;

    charset utf-8;
    client_max_body_size 64M;

    # Performance: Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Access and Error Logs
    access_log /var/log/nginx/netfusion_access.log;
    error_log  /var/log/nginx/netfusion_error.log error;

    # Front Controller Routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # High Performance Static Asset Caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform, max-age=2592000";
        access_log off;
        log_not_found off;
    }

    # Deny access to sensitive files and hidden dotfiles (.env, .git, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny direct access to internal framework directories
    location ~ ^/(storage|config|core|app|database|resources|deploy|bin)/ {
        deny all;
        return 404;
    }

    # PHP-FPM FastCGI Handler
    location ~ \.php$ {
        # Standard Ubuntu/Debian PHP 8.2 socket:
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;

        # For CentOS/RHEL/AlmaLinux use:
        # fastcgi_pass unix:/run/php-fpm/www.sock;

        # For TCP FPM pool use:
        # fastcgi_pass 127.0.0.1:9000;

        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 60s;
        fastcgi_connect_timeout 60s;
    }

    # Framework Healthcheck
    location = /healthz {
        access_log off;
        return 200 "OK\n";
    }
}
