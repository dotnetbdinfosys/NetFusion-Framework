# ==============================================================================
# NetFusion Framework — Universal Apache 2.4 VirtualHost Configuration
# Suitable for : Ubuntu, Debian, CentOS, RHEL, AlmaLinux, Rocky Linux
# Paths        : Ubuntu/Debian -> /etc/apache2/sites-available/netfusion.conf
#                RHEL/CentOS   -> /etc/httpd/conf.d/netfusion.conf
# Author       : Md. Atiquzzaman Ashish (DotNetBD)
# Website      : www.dotnetbd.com
# ==============================================================================

<VirtualHost *:80>
    ServerName your-domain.com
    ServerAlias www.your-domain.com
    DocumentRoot /var/www/netfusion/public

    <Directory /var/www/netfusion/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # PHP-FPM Proxy via Unix Socket (Ubuntu/Debian)
    <IfModule proxy_fcgi_module>
        <FilesMatch \.php$>
            SetHandler "proxy:unix:/var/run/php/php8.2-fpm.sock|fcgi://localhost/"
            # For CentOS/RHEL/AlmaLinux use:
            # SetHandler "proxy:unix:/run/php-fpm/www.sock|fcgi://localhost/"
        </FilesMatch>
    </IfModule>

    # Logging
    ErrorLog /var/log/apache2/netfusion_error.log
    CustomLog /var/log/apache2/netfusion_access.log combined
</VirtualHost>
